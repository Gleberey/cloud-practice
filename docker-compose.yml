services:
  listingservice:
    build:
      context: .
      dockerfile: ListingService/Dockerfile
    container_name: listingservice
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development

  disputeservice:
    build:
      context: .
      dockerfile: DisputeService/Dockerfile
    container_name: disputeservice
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development